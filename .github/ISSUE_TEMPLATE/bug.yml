name: Bug report
description: Report a reproducible problem in Suluu.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: Suluu version or registry URL
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - shadcn registry
        - npm package
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal repository or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, React, framework, Tailwind, and Motion versions.
    validations:
      required: true
