name: Component or feature proposal
description: Propose a focused addition to Suluu.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What product-interface problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful API and interaction model.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
